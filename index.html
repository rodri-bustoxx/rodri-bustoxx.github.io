<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="description" content="Hub privado de acceso a recursos digitales." />
  <title>Acceso privado</title>
  <style>
    :root{
      --bg:#070a12;--surface:rgba(255,255,255,.08);--surface-2:rgba(255,255,255,.13);--text:#f7f1e8;--muted:#aab1bf;--line:rgba(255,255,255,.15);--accent:#d77a3d;--accent-2:#7c5cff;--good:#2fb87c;--bad:#e07159;--shadow:0 26px 80px rgba(0,0,0,.42);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 16% 12%,rgba(215,122,61,.28),transparent 34%),radial-gradient(circle at 86% 20%,rgba(124,92,255,.25),transparent 30%),radial-gradient(circle at 70% 92%,rgba(47,184,124,.17),transparent 30%),var(--bg);overflow:hidden}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.75),transparent 78%);z-index:-1}
    .gate{width:min(100%,470px);border:1px solid var(--line);background:linear-gradient(180deg,var(--surface-2),var(--surface));backdrop-filter:blur(22px);border-radius:30px;padding:30px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:rise .55s ease both}
    .gate::after{content:"";position:absolute;width:260px;height:260px;right:-110px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(215,122,61,.33),transparent 68%);pointer-events:none}
    .mark{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));font-weight:950;box-shadow:0 16px 34px rgba(124,92,255,.24);margin-bottom:22px}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:999px;padding:7px 11px;font-size:.78rem;font-weight:850;text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px}.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 6px rgba(47,184,124,.13)}
    h1{font-size:clamp(2rem,8vw,3.2rem);line-height:.96;letter-spacing:-.07em;margin-bottom:12px;max-width:10ch}
    p{color:var(--muted);line-height:1.65;font-size:.96rem;margin-bottom:22px;max-width:37ch}
    label{display:block;font-size:.82rem;color:var(--muted);font-weight:850;margin-bottom:8px}
    .field{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:18px;padding:9px 10px;transition:.2s}.field:focus-within{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.1)}
    input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:1rem;padding:8px 4px}input::placeholder{color:rgba(170,177,191,.65)}
    .show{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:.86rem;font-weight:850;padding:7px;border-radius:12px}.show:hover{color:var(--text);background:rgba(255,255,255,.08)}
    button.unlock{width:100%;min-height:50px;border:0;border-radius:999px;margin-top:14px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));font-weight:950;font-size:.95rem;cursor:pointer;box-shadow:0 16px 34px rgba(124,92,255,.22);transition:.18s}button.unlock:hover{transform:translateY(-2px);box-shadow:0 20px 44px rgba(0,0,0,.24)}button.unlock:disabled{opacity:.72;cursor:wait;transform:none}
    .msg{min-height:22px;margin-top:12px;color:var(--muted);font-size:.86rem;font-weight:800}.msg.error{color:var(--bad)}.msg.ok{color:var(--good)}
    .small{margin-top:14px;margin-bottom:0;font-size:.78rem;color:rgba(170,177,191,.72)}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:520px){.gate{padding:24px;border-radius:24px}body{padding:14px}}
  </style>
</head>
<body>
  <main class="gate" aria-label="Acceso privado">
    <div class="mark">H</div>
    <div class="eyebrow">Acceso privado</div>
    <h1>Contenido protegido.</h1>
    <p>Ingresá la contraseña para abrir el hub principal. El contenido de esta página está cifrado y no queda visible en el HTML.</p>
    <form id="unlockForm" autocomplete="off">
      <label for="password">Contraseña</label>
      <div class="field">
        <input id="password" name="password" type="password" placeholder="Ingresar contraseña" autocomplete="current-password" autofocus />
        <button class="show" type="button" id="showPassword" aria-label="Mostrar contraseña">Ver</button>
      </div>
      <button class="unlock" type="submit" id="unlockButton">Entrar</button>
      <div class="msg" id="message" role="status" aria-live="polite"></div>
    </form>
    <p class="small">Protección local para GitHub Pages. Para seguridad de nivel servidor hace falta backend o control de acceso externo.</p>
  </main>

    const form = document.getElementById('unlockForm');
    const passwordInput = document.getElementById('password');
    const message = document.getElementById('message');
    const button = document.getElementById('unlockButton');
    const showPassword = document.getElementById('showPassword');

    function b64ToBytes(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function deriveKey(password, salt, iterations) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }

    async function unlock(password) {
      const salt = b64ToBytes(payload.salt);
      const iv = b64ToBytes(payload.iv);
      const data = b64ToBytes(payload.ciphertext);
      const key = await deriveKey(password, salt, payload.iterations);
      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
      return new TextDecoder().decode(decrypted);
    }

    showPassword.addEventListener('click', () => {
      const visible = passwordInput.type === 'text';
      passwordInput.type = visible ? 'password' : 'text';
      showPassword.textContent = visible ? 'Ver' : 'Ocultar';
      passwordInput.focus();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = passwordInput.value;
      if (!password) {
        message.textContent = 'Ingresá la contraseña.';
        message.className = 'msg error';
        return;
      }
      button.disabled = true;
      button.textContent = 'Verificando...';
      message.textContent = 'Descifrando contenido...';
      message.className = 'msg';
      try {
        const html = await unlock(password);
        message.textContent = 'Acceso concedido.';
        message.className = 'msg ok';
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        message.textContent = 'Contraseña incorrecta.';
        message.className = 'msg error';
        button.disabled = false;
        button.textContent = 'Entrar';
        passwordInput.select();
      }
    });
  </script>
